[project]
name = "ai-native-engineering"
version = "0.1.0"
description = "A playbook and small tools for teams that build software with AI coding agents."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["tools", "tests"]
